<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ENG360 - Aviation Engineering Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            aviation: "#29496d",
            reportGreen: "#a9c9ac",
            reportBorder: "#6b9f72",
            paper: "#f4f4f1",
            sidebar: "#0f172a",
            sidebarHover: "#1e293b"
          }
        }
      }
    };
  </script>
  <style>
    @font-face {
      font-family: "Emirates";
      src: local("Emirates"), local("Emirates Regular"), local("Emirates Medium"), local("Emirates Bold");
      font-weight: 400 900;
      font-style: normal;
      font-display: swap;
    }
    * { box-sizing: border-box; font-family: "Emirates", "Emirates Regular", Arial, sans-serif; }
    body { font-family: "Emirates", Arial, sans-serif; }
    .logo-mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 48px;
      border: 2px solid var(--green);
      background: white;
      color: var(--blue);
      padding: 8px 12px;
      font: 900 20px/1 var(--ui-font);
      letter-spacing: .04em;
    }
    :root {
      --blue: #29496d;
      --green: #a9c9ac;
      --green-dark: #6b9f72;
      --paper: #f4f4f1;
      --ink: #080808;
      --ui-bg: #eef2f4;
    }
    .app-card {
      transition: transform .15s ease, box-shadow .15s ease;
    }
    .app-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(0,0,0,.15);
    }
    .sidebar-link {
      transition: background .15s ease, border-color .15s ease;
    }
    .sidebar-link:hover, .sidebar-link.active {
      background: #1e293b;
      border-left: 3px solid var(--green);
    }
    .sidebar {
      width: 16rem;
      transition: width .2s ease;
    }
    .sidebar-collapsed .sidebar {
      width: 4.75rem;
    }
    .sidebar-label,
    .sidebar-user-details,
    .sidebar-section-label {
      transition: opacity .15s ease;
    }
    .sidebar-collapsed .sidebar-label,
    .sidebar-collapsed .sidebar-user-details,
    .sidebar-collapsed .sidebar-section-label {
      display: none;
    }
    .sidebar-collapsed .sidebar-link {
      justify-content: center;
      padding-left: .5rem;
      padding-right: .5rem;
    }
    .sidebar-collapsed .sidebar-user {
      justify-content: center;
    }
    iframe.app-frame {
      width: 100%;
      height: calc(100vh - 80px);
      border: none;
      background: #f8fafc;
    }
    @media print {
      .no-print { display: none !important; }
    }
  </style>
</head>
<body class="min-h-screen bg-slate-100 text-slate-950">
  <div id="authOverlay" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/60">
    <form id="authForm" class="w-full max-w-sm rounded-lg border border-white/20 bg-white p-6 shadow-2xl">
      <div class="mb-6 text-center">
        <div class="logo-mark text-2xl">ENG360</div>
        <p class="mt-2 text-sm font-semibold text-slate-600">Aviation Engineering Suite</p>
      </div>
      <div class="space-y-4">
        <label class="block space-y-1">
          <span class="text-xs font-bold uppercase tracking-wide text-slate-500">Email</span>
          <input id="authEmail" type="email" class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm font-semibold outline-none focus:border-aviation focus:ring-2 focus:ring-aviation/20" required />
        </label>
        <label class="block space-y-1">
          <span class="text-xs font-bold uppercase tracking-wide text-slate-500">Password</span>
          <input id="authPassword" type="password" class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm font-semibold outline-none focus:border-aviation focus:ring-2 focus:ring-aviation/20" required />
        </label>
        <p id="authError" class="hidden text-sm font-bold text-red-700">Invalid credentials.</p>
        <button type="submit" class="w-full rounded-md bg-aviation py-2.5 text-sm font-bold text-white hover:bg-aviation/90">Sign In</button>
      </div>
    </form>
  </div>

  <div id="appShell" class="flex min-h-screen">
    <aside id="sidebar" class="sidebar no-print flex flex-col border-r border-slate-200 bg-sidebar text-white">
      <div class="flex items-center gap-3 border-b border-slate-700 p-4">
        <div class="logo-mark text-xl">ENG360</div>
        <div class="sidebar-label">
          <div class="text-sm font-black leading-tight">Engineering</div>
          <div class="text-[10px] font-bold uppercase tracking-wider text-slate-400">Suite v1.1</div>
        </div>
      </div>
      <nav class="flex-1 overflow-y-auto p-3">
        <div class="sidebar-section-label mb-2 px-2 text-[10px] font-bold uppercase tracking-wider text-slate-500">Applications</div>
        <div id="appNav" class="space-y-1"></div>
      </nav>
      <div class="border-t border-slate-700 p-3">
        <div class="sidebar-user flex items-center gap-2 rounded-md bg-slate-800 p-2">
          <div class="flex h-8 w-8 items-center justify-center rounded-full bg-aviation text-xs font-black">U</div>
          <div class="sidebar-user-details min-w-0">
            <div id="userDisplay" class="truncate text-sm font-bold">Guest</div>
            <div id="userRole" class="truncate text-[10px] font-bold uppercase text-slate-400">Not signed in</div>
          </div>
          <button id="logoutBtn" class="ml-auto rounded p-1 text-slate-400 hover:text-white" title="Sign out">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
          </button>
        </div>
      </div>
    </aside>

    <main class="flex-1 flex flex-col min-w-0">
      <header class="no-print flex items-center justify-between border-b border-slate-200 bg-white px-6 py-3">
        <div class="flex items-center gap-3">
          <button id="sidebarToggle" class="rounded-md p-2 text-slate-500 hover:bg-slate-100 hover:text-slate-900" type="button" title="Collapse navigation" aria-label="Collapse navigation" aria-expanded="true">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
          <div>
            <h1 id="pageTitle" class="text-lg font-black text-slate-900">Dashboard</h1>
            <p id="pageSubtitle" class="text-xs font-semibold text-slate-500">Select an application to begin</p>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <span id="statusBadge" class="hidden rounded-full bg-green-100 px-2.5 py-1 text-[10px] font-bold uppercase text-green-700">Online</span>
        </div>
      </header>
      <section id="contentArea" class="flex-1 overflow-hidden relative">
        <div id="dashboard" class="absolute inset-0 overflow-auto p-6">
          <div class="mx-auto max-w-5xl">
            <div class="mb-6 rounded-lg border border-slate-200 bg-white p-5 shadow-sm">
              <h2 class="text-sm font-black uppercase tracking-wide text-slate-700">Welcome to ENG360</h2>
              <p class="mt-1 text-sm text-slate-600">Aviation cabin-safety engineering tools. Select an application below to launch.</p>
            </div>
            <div id="appGrid" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3"></div>
          </div>
        </div>
        <iframe id="appFrame" class="app-frame hidden" title="Active Application"></iframe>
      </section>
    </main>
  </div>

  <script type="module">
    const AppRegistry = {
      apps: [
        {
          id: "shop-report-form",
          name: "Shop Report Builder",
          description: "Cabin-safety workshop inspection and findings report with PDF export.",
          icon: `<svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>`,
            path: "apps/shop-report-form/index.html",
          color: "bg-aviation"
        },
        {
            id: "asset-release",
            name: "Comment Generator",
            description: "Select an asset and generate a controlled release comment.",
            icon: `<svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m-9-9h.01M9 3h6a2 2 0 012 2v14a2 2 0 01-2 2H9a2 2 0 01-2-2V5a2 2 0 012-2z"/></svg>`,
            path: "apps/asset-release/index.html",
            color: "bg-emerald-600"
        }
      ]
    };

    const Auth = {
      sessionKey: "eng360_session.v1",
      userKey: "eng360_user.v1",
      isLoggedIn() {
        return sessionStorage.getItem(this.sessionKey) === "active";
      },
      login(email) {
        sessionStorage.setItem(this.sessionKey, "active");
        sessionStorage.setItem(this.userKey, email);
      },
      logout() {
        sessionStorage.removeItem(this.sessionKey);
        sessionStorage.removeItem(this.userKey);
      },
      getUser() {
        return sessionStorage.getItem(this.userKey) || "user@eng360.app";
      }
    };

    const UI = {
      init() {
        this.cache();
        this.bind();
        if (localStorage.getItem("eng360_sidebar_collapsed.v1") === "true") {
          this.appShell.classList.add("sidebar-collapsed");
          this.sidebarToggle.setAttribute("aria-expanded", "false");
          this.sidebarToggle.setAttribute("aria-label", "Expand navigation");
          this.sidebarToggle.title = "Expand navigation";
        }
        this.renderSidebar();
        this.renderDashboard();
        this.syncAuth();
      },
      cache() {
        this.authOverlay = document.getElementById("authOverlay");
        this.authForm = document.getElementById("authForm");
        this.authEmail = document.getElementById("authEmail");
        this.authPassword = document.getElementById("authPassword");
        this.authError = document.getElementById("authError");
        this.appShell = document.getElementById("appShell");
        this.sidebarToggle = document.getElementById("sidebarToggle");
        this.appNav = document.getElementById("appNav");
        this.appGrid = document.getElementById("appGrid");
        this.appFrame = document.getElementById("appFrame");
        this.dashboard = document.getElementById("dashboard");
        this.pageTitle = document.getElementById("pageTitle");
        this.pageSubtitle = document.getElementById("pageSubtitle");
        this.userDisplay = document.getElementById("userDisplay");
        this.userRole = document.getElementById("userRole");
        this.logoutBtn = document.getElementById("logoutBtn");
        this.statusBadge = document.getElementById("statusBadge");
      },
      bind() {
        this.authForm.addEventListener("submit", e => {
          e.preventDefault();
          this.handleLogin();
        });
        this.logoutBtn.addEventListener("click", () => {
          Auth.logout();
          this.syncAuth();
        });
        this.sidebarToggle.addEventListener("click", () => this.toggleSidebar());
        window.addEventListener("message", e => {
          if (e.data && e.data.type === "eng360-set-title") {
            this.pageTitle.textContent = e.data.title || "Application";
            this.pageSubtitle.textContent = e.data.subtitle || "";
          }
        });
      },
      toggleSidebar() {
        const collapsed = this.appShell.classList.toggle("sidebar-collapsed");
        this.sidebarToggle.setAttribute("aria-expanded", String(!collapsed));
        this.sidebarToggle.setAttribute("aria-label", collapsed ? "Expand navigation" : "Collapse navigation");
        this.sidebarToggle.title = collapsed ? "Expand navigation" : "Collapse navigation";
        localStorage.setItem("eng360_sidebar_collapsed.v1", String(collapsed));
      },
      handleLogin() {
        const email = this.authEmail.value.trim();
        const password = this.authPassword.value.trim();
        if (!email || !password) {
          this.authError.classList.remove("hidden");
          return;
        }
        this.authError.classList.add("hidden");
        Auth.login(email);
        this.syncAuth();
      },
      syncAuth() {
        if (Auth.isLoggedIn()) {
          this.authOverlay.classList.add("hidden");
          this.authOverlay.classList.remove("flex");
          this.userDisplay.textContent = Auth.getUser().split("@")[0];
          this.userRole.textContent = "Engineer";
          this.statusBadge.classList.remove("hidden");
        } else {
          this.authOverlay.classList.remove("hidden");
          this.authOverlay.classList.add("flex");
          this.userDisplay.textContent = "Guest";
          this.userRole.textContent = "Not signed in";
          this.statusBadge.classList.add("hidden");
          this.closeApp();
        }
      },
      renderSidebar() {
        this.appNav.innerHTML = AppRegistry.apps.map(app => `
          <button data-app="${app.id}" class="sidebar-link flex w-full items-center gap-2 rounded-md border-l-3 border-transparent px-3 py-2 text-left text-sm font-semibold text-slate-300 hover:text-white">
            <span class="flex h-8 w-8 items-center justify-center rounded-md ${app.color} text-white">${app.icon}</span>
            <span class="sidebar-label truncate">${app.name}</span>
          </button>
        `).join("");
        this.appNav.querySelectorAll("[data-app]").forEach(btn => {
          btn.addEventListener("click", () => this.openApp(btn.dataset.app));
        });
      },
      renderDashboard() {
        this.appGrid.innerHTML = AppRegistry.apps.map(app => `
          <div class="app-card cursor-pointer rounded-lg border border-slate-200 bg-white p-5 shadow-sm" data-launch="${app.id}">
            <div class="flex items-center gap-3">
              <div class="flex h-10 w-10 items-center justify-center rounded-lg ${app.color} text-white">${app.icon}</div>
              <div>
                <div class="font-black text-slate-900">${app.name}</div>
                <div class="text-xs text-slate-500">${app.path ? "Ready" : "Coming soon"}</div>
              </div>
            </div>
            <p class="mt-3 text-sm text-slate-600">${app.description}</p>
            ${app.path ? `<button class="mt-4 rounded-md bg-aviation px-4 py-2 text-xs font-bold text-white hover:bg-aviation/90">Launch</button>` : `<button disabled class="mt-4 rounded-md bg-slate-200 px-4 py-2 text-xs font-bold text-slate-400">Notify Me</button>`}
          </div>
        `).join("");
        this.appGrid.querySelectorAll("[data-launch]").forEach(card => {
          card.addEventListener("click", () => {
            const id = card.dataset.launch;
            const app = AppRegistry.apps.find(a => a.id === id);
            if (app && app.path) this.openApp(id);
          });
        });
      },
      openApp(id) {
        const app = AppRegistry.apps.find(a => a.id === id);
        if (!app || !app.path) return;
        this.dashboard.classList.add("hidden");
        this.appFrame.classList.remove("hidden");
        this.appFrame.src = app.path;
        this.pageTitle.textContent = app.name;
        this.pageSubtitle.textContent = app.description;
        this.appNav.querySelectorAll("[data-app]").forEach(btn => {
          btn.classList.toggle("active", btn.dataset.app === id);
        });
      },
      closeApp() {
        this.appFrame.src = "about:blank";
        this.appFrame.classList.add("hidden");
        this.dashboard.classList.remove("hidden");
        this.pageTitle.textContent = "Dashboard";
        this.pageSubtitle.textContent = "Select an application to begin";
        this.appNav.querySelectorAll("[data-app]").forEach(btn => btn.classList.remove("active"));
      }
    };

    document.addEventListener("DOMContentLoaded", () => UI.init());
  </script>
</body>
</html>
